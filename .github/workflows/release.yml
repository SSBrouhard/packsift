name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check whether version is already published
        id: registry
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          error_log="$(mktemp)"

          set +e
          npm view "$package_name@$package_version" version --json > /dev/null 2>"$error_log"
          view_status=$?
          set -e

          if [ "$view_status" -eq 0 ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version is already published; skipping npm publish."
          elif grep -q "E404" "$error_log"; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version is not published; continuing."
          else
            cat "$error_log" >&2
            exit "$view_status"
          fi

      - name: Publish package with provenance
        if: steps.registry.outputs.already_published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
